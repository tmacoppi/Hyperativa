openapi: 3.0.3
info:
  title: Card Management API
  description: API para cadastro e importação assíncrona de cartões de crédito.
  version: 1.0.0
paths:
  /api/v1/cards/register:
    post:
      tags:
        - Card
      summary: Cadastra um novo cartão
      operationId: registerCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardRequest'
      responses:
        '200':
          description: Cartão cadastrado com sucesso
  /api/v1/cards/import:
    post:
      tags:
        - Card
      summary: Inicia a importação de cartões via TXT
      operationId: importCards
      responses:
        '202':
          description: Processamento de importação iniciado em background
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    CardRequest:
      type: object
      required:
        - clientName
        - cardNumber
      properties:
        clientName:
          type: string
          description: Nome completo do titular do cartão
          example: "João da Silva"
        cardNumber:
          type: string
          description: Número completo do cartão de crédito
          example: "1234567890123456"